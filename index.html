 6-Tage-Woche, anteilig nach Arbeitstagen, ohne Rundung. Bei Elternzeit oder Ein-/Austritt k\xFCrzt die App um 1/12 pro vollem Kalendermonat (Zw\xF6lftelung). Das ist ein Vorschlag, den die Leitung best\xE4tigt.']})},{id:"notdienst",title:"Notdienst",teaser:"Nacht ab 19:00 (Ladenschluss), Auszahlung statt automatischer Gutschrift",body:(0,Dt.jsxs)(Dt.Fragment,{children:["Tags\xFCber wird der Dienst normal im Plan eingetragen und z\xE4hlt ins Ist. Die Nachtbereitschaft beginnt um 19:00 mit dem Ladenschluss und geht bis 8:30 am Folgetag; zugewiesen wird sie auf der Notdienst-Seite, nur an Apotheker:innen. Die App schreibt f\xFCr N\xE4chte keine automatischen Stunden ins Konto: N\xE4chte werden im selben Monat als \xDCberstunden ausbezahlt, die Zuschl\xE4ge rechnet die Lohnbuchhaltung. Wer stattdessen Freizeit m\xF6chte, bekommt die Stunden (Zahl vom Steuerb\xFCro) von der Leitung als Stundenkorrektur eingetragen.",(0,Dt.jsx)("strong",{children:" \xDCbertariflich abgegolten"})," = nur Doku."]})},{id:"feiertage",title:"Feiertage & Ferien",teaser:"Feiertag schreibt Musterstunden gut, Ferien sind nur Anzeige",body:(0,Dt.jsx)(Dt.Fragment,{children:"Gesetzliche Feiertage (Bayern) sind im Planer grau. Wer laut Muster gearbeitet h\xE4tte, bekommt die Tagesstunden gutgeschrieben. Kein Minus durch den Feiertag. Schulferien werden nur angezeigt, sie \xE4ndern keine Stunden."})},{id:"schliesstage",title:"Sondertage & halbe Schlie\xDFtage (24.12., 31.12., Fasching ...)",teaser:"Verk\xFCrzt offen: wer kommt, verliert nichts \u2014 so z\xE4hlen die Stunden",body:(0,Dt.jsxs)(Dt.Fragment,{children:["Sondertage sind Ausnahme-Tage mit eigenen \xD6ffnungszeiten, z. B. Heiligabend und Silvester (offen bis 13:00) oder regionale Tage wie der Faschingsdienstag. Die Leitung hinterlegt sie auf der Filialen-Seite; im Wochenplaner und im Druck sind die geschlossenen Zeiten grau, der Name steht \xFCber dem Tag.",(0,Dt.jsx)("br",{}),(0,Dt.jsx)("strong",{children:"So z\xE4hlen die Stunden an einem
